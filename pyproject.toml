[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stash-home"
version = "0.1.0"
description = "Small self-hosted file storage"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn>=0.34,<1",
  "wsgidav>=4.3,<5",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "argon2-cffi>=23.1,<27",
  "python-multipart>=0.0.20,<1",
  "jinja2>=3.1,<4",
  "python-dotenv>=1.0,<2",
  "asgiref>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["stash*"]

[tool.setuptools.package-data]
stash = ["templates/*.html", "static/*.css", "static/*.js", "static/*.png"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"] # FastAPI dependency injection uses Depends in defaults.

[tool.pytest.ini_options]
testpaths = ["tests"]
